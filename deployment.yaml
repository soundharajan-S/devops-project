apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: devops-project
  name: devops-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
            - image: 807598718740.dkr.ecr.ap-south-1.amazonaws.com/devops-project:latest
        name: devops-project
---
apiVersion: v1
kind: Service
metadata:
  name: devops-service
spec:
  ports:
    - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: devops-project
  type: LoadBalancer
