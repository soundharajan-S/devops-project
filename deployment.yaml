cat > deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
            - name: devops-app
        image: 807598718740.dkr.ecr.ap-south-1.amazonaws.com/devops-project:latest
        imagePullPolicy: Always
        ports:
                - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-service
spec:
  type: LoadBalancer
  selector:
    app: devops-project
  ports:
    - port: 80
    targetPort: 80
    protocol: TCP
EOF

cat deployment.yaml

# Validate pannu
kubectl apply --dry-run=client -f deployment.yaml
echo "✅ YAML OK!"

git add deployment.yaml
git commit -m "Fix yaml indentation - final working"
git push origin main
