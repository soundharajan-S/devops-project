cat > deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
            - name: devops-app
        image: 807598718740.dkr.ecr.ap-south-1.amazonaws.com/devops-project:latest
        imagePullPolicy: Always
        ports:
                - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-service
spec:
  type: LoadBalancer
  selector:
    app: devops-project
  ports:
    - port: 80
    targetPort: 3000
    protocol: TCP
EOF

cat deployment.yaml
git add deployment.yaml Jenkinsfile
git commit -m "Add ECR auto push + EKS deploy - final"
git push origin main
