apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  labels:
    app: devops-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
            - name: devops-project
        image: 807598718740.dkr.ecr.ap-south-1.amazonaws.com/devops-project:latest
        ports:
                - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-service
spec:
  selector:
    app: devops-project
  ports:
    - port: 80
    targetPort: 80
  type: LoadBalancer
